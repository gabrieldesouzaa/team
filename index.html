<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Onboarding Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="chat-header">
      <div class="chat-header-left">
        <div class="bot-icon"></div>
        <div class="bot-info">
          <div class="bot-name">Abercrombie & Fitch HR Bot</div>
          <div class="bot-status">We're online ...</div>
        </div>
      </div>
      <div class="chat-header-right">
        <button class="icon-btn" id="refresh-btn" title="Refresh chat">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
        </button>
        <button class="icon-btn" id="minimize-btn" title="Minimize">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>

    <div class="date-divider" id="date-divider"></div>

    <main id="chat-log" class="chat-log"></main>

    <form id="chat-form" class="chat-form">
      <input
        id="user-input"
        type="text"
        autocomplete="off"
        placeholder="Enter message"
      />
      <button type="submit" class="send-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
